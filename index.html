<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juego Cazando</title>
  <link rel="stylesheet" href="cazando.css" />
</head>

<body onload="iniciarJuego()">

  <main class="contenedor">

    <header class="encabezado">
      <h1>🐱 Juego Cazando 🐾</h1>
      <p class="autor">Autor: ZAHID NAZATE</p>
      <p class="subtitulo">Ayuda al gatito a atrapar su comida antes de que se acabe el tiempo</p>
    </header>

    <section class="zona-juego">
      <canvas id="areaJuego" width="500" height="500"></canvas>
    </section>

    <!-- Barra única: panel (columna vertical) a la izquierda, controles a la derecha -->
    <div class="barra-controles">

      <div class="panel">
        <span class="marcador">🍖 Puntos: <span id="puntos">0</span></span>
        <button class="boton-reiniciar" onclick="reiniciar()">🔁 Reiniciar</button>
        <span class="marcador">⏰ Tiempo: <span id="tiempo">10</span></span>
      </div>

      <div class="controles">
        <button class="boton-flecha" onclick="moverArriba()">⬆</button>
        <br>
        <button class="boton-flecha" onclick="moverIzquierda()">⬅</button>
        <button class="boton-flecha" onclick="moverAbajo()">⬇</button>
        <button class="boton-flecha" onclick="moverDerecha()">➡</button>
      </div>

    </div>

    <p id="mensaje"></p>

  </main>

  <script src="cazando.js"></script>
  <script src="utilitarios.js"></script>
</body>

</html>
